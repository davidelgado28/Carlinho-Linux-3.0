name: Build Carlinho-Linux ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build squashfs-tools xorriso || true
          # Instalar live-build mais recente do Debian
          wget http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502_all.deb -O /tmp/lb.deb || true
          sudo dpkg -i /tmp/lb.deb || sudo apt-get install -f -y


      - name: Build ISO
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          chmod +x build.sh
          sudo bash ./build.sh

      - name: Rename ISO
        run: |
          mv images/*.iso Carlinho-Linux-amd64.iso || true
          find . -name "*.iso" -exec mv {} Carlinho-Linux-amd64.iso \;

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Carlinho-Linux-ISO
          path: Carlinho-Linux-amd64.iso
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: Carlinho-Linux-amd64.iso

      - name: Upload build log
        if: always()   
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
